replicaCount: 1
shopBaseDomain: localhost

image:
  repository: slepimis120/devops-shop-operator
  # Jednako `appVersion` u Chart.yaml: oba opisuju binar operatora, ne chart.
  # Objavljuje ga tag `v0.6.0` u shop-operator repou
  tag: "0.6.0"
  pullPolicy: Always

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

rbac:
  create: true

serviceAccount:
  create: true
  name: shop-operator
