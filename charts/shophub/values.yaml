# ShopHub aplikacija
#
# Front-end i back-end idu pod jedan host: Ingress salje /api na back-end, sve
# ostalo na front-end. To je isti oblik koji shop-operator daje svakoj
# prodavnici, i zbog njega front-end ne dobija adresu back-enda -- browser je
# razresava sam, u odnosu na stranicu na kojoj je.

nameOverride: ""
fullnameOverride: ""

frontend:
  replicaCount: 2
  image:
    repository: slepimis120/devops-shophub-frontend
    tag: "0.2.1"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

backend:
  replicaCount: 2
  image:
    repository: slepimis120/devops-shophub-backend
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  host: shophub.localhost
  tls: []

# Domen pod kojim se objavljuju prodavnice koje ShopHub kreira.
#
# Mora biti jednak `shopBaseDomain` u shop-operator chart-u: operator upisuje
# Ingress host, a ShopHub pravi link koji vlasnik otvara iz dashboard-a. Ako se
# razlikuju, prodavnica radi ali link vodi na host koji Ingress ne objavljuje.
shopBaseDomain: localhost

# Namespace u kojem se kreiraju Shop resursi. ShopHub dobija prava nad shops
# samo u ovom namespace-u.
shopNamespace: default

auth:
  # Ime postojeceg Secret-a sa JWT_SECRET. Jedina opcija koja se dobro ponasa
  # pod ArgoCD-om: on renderuje chart bez pristupa klasteru, pa bi generisan
  # kljuc bio nov pri svakoj sinhronizaciji i odjavio bi sve korisnike.
  #
  #   kubectl create secret generic shophub-auth -n shophub \
  #     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
  existingSecret: ""
  # Koristi se kad je existingSecret prazan. Ako je i ovo prazno, chart
  # generise kljuc -- u redu za `helm install`, nije za ArgoCD.
  jwtSecret: ""
  expiresIn: 1h

# ShopHub-ova sopstvena baza: nalozi i spisak prodavnica po korisniku.
# Deploy-uje je CNPG, isti operator koji koristi `standard` prodavnica.
#
# Kljuc je `database`, ne `postgresql`: vrednosti subchart-a zive pod kljucem
# jednakim imenu subchart-a, pa bi `postgresql:` postao Bitnami-jev cim bi se
# takav dependency dodao.
database:
  enabled: true
  storage: 1Gi

monitoring:
  enabled: true

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 30d
  grafana:
    enabled: true
