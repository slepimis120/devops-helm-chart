apiVersion: v2
name: shophub
description: Helm chart for ShopHub platform - dynamic shop management and deployment
type: application
version: 1.0.0
# Verzija same aplikacije, ne chart-a. Ne bira sliku, to rade
# frontend.image.tag i backend.image.tag, ali zavrsava kao
# app.kubernetes.io/version na svakom resursu i kao APP VERSION u `helm ls`.
# Zato prati najnoviju objavljenu ShopHub sliku.
appVersion: "1.0.0"
keywords:
  - shophub
  - shop-management
  - saas
maintainers:
  - name: slepimis120
    url: https://github.com/slepimis120
  - name: s-katarina
    url: https://github.com/s-katarina
dependencies:
  - name: kube-prometheus-stack
    version: "51.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: monitoring.enabled
