{{- if .Values.ingress.enabled -}}
{{/*
One host for both halves, which is what makes ShopHub's own requests
same-origin: /api reaches the backend, everything else the frontend. nginx
matches the longer path first and forwards it unchanged, which is what the
backend expects -- its routes start with /api/v1.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shophub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "shophub.backendName" . }}
                port:
                  number: {{ .Values.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shophub.frontendName" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
