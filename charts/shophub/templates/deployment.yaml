{{- $db := include "shophub.databaseName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shophub.backendName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "shophub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "shophub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      # The backend creates Shop resources, so it needs an identity of its own
      # rather than the namespace default.
      serviceAccountName: {{ include "shophub.serviceAccountName" . }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            # Where the shops it creates live, and the domain they are published
            # under. SHOP_BASE_DOMAIN has to match the operator's
            # --shop-base-domain: the operator writes the Ingress host, this
            # builds the link to it.
            - name: SHOP_NAMESPACE
              value: {{ .Values.shopNamespace | quote }}
            - name: SHOP_BASE_DOMAIN
              value: {{ .Values.shopBaseDomain | quote }}
            - name: KUBERNETES_ENABLED
              value: "true"
            - name: KUBERNETES_AUTH_MODE
              value: "auto"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "shophub.authSecretName" . }}
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              value: {{ .Values.auth.expiresIn | quote }}
            {{- if .Values.database.enabled }}
            # CNPG generates the password and publishes every credential in a
            # secret named after the Cluster, so nothing here has to know it.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $db }}-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $db }}-app
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $db }}-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db }}-app
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $db }}-app
                  key: dbname
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shophub.frontendName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "shophub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "shophub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # No backend address here: the Ingress publishes both halves under one
          # host, so the browser resolves /api/... against the page it is on.
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
