{{- if not .Values.auth.existingSecret }}
{{/*
The key ShopHub signs its access tokens with.

Generated only as a last resort. `lookup` reuses whatever is already in the
cluster so a `helm upgrade` does not sign every user out, but ArgoCD renders the
chart without cluster access, where `lookup` finds nothing and every sync would
mint a new key. Set `auth.existingSecret` for anything GitOps manages.
*/}}
{{- $name := include "shophub.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $jwt := .Values.auth.jwtSecret -}}
{{- if not $jwt -}}
{{- if and $existing $existing.data -}}
{{- $jwt = index $existing.data "JWT_SECRET" | b64dec -}}
{{- else -}}
{{- $jwt = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ $jwt | quote }}
{{- end }}
