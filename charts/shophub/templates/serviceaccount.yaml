apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shophub.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
---
{{/*
ShopHub creates, reconfigures and deletes Shop resources; the operator does
everything that follows from them. A namespaced Role rather than a ClusterRole:
it may only touch shops in the namespace it deploys them to. The binding lives
in that namespace while the account it names lives in the release namespace.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shophub.fullname" . }}-shops
  namespace: {{ .Values.shopNamespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
rules:
  - apiGroups: ["shop.shophub.local"]
    resources: ["shops"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["shop.shophub.local"]
    resources: ["shops/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shophub.fullname" . }}-shops
  namespace: {{ .Values.shopNamespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shophub.fullname" . }}-shops
subjects:
  - kind: ServiceAccount
    name: {{ include "shophub.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
