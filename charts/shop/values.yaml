# Jedna prodavnica, deploy-ovana bez operatora.
#
# Ovo nije put kojim ide ShopHub: on kreira Shop custom resource, a operator iz
# njega pravi Deployment-e, Service-e i Ingress (zahtev 3.1). Ovaj chart je tu
# za rucni deploy -- da se isproba slika, ili u klasteru gde operator nije
# instaliran.
replicaCount: 2

image:
  repository: slepimis120/devops-shop
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: "nginx"
  hosts:
    # Browser sam razresava svako ime pod `localhost` na loopback adresu, pa
    # ovde ne treba DNS zapis ni upis u hosts fajl. Drzati u skladu sa
    # `shopBaseDomain` iz shop-operator chart-a.
    - host: shop.localhost
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
